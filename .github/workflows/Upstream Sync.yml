name: Upstream Sync Test

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  test_sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Pure Git Sync Only
        run: |
          git remote add upstream https://github.com/jaywcjlove/linux-command.git 2>/dev/null || true
          git fetch upstream gh-pages
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/gh-pages)
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            git merge --ff-only upstream/gh-pages
            git push origin gh-pages
            echo "✅ Synced successfully"
          else
            echo "✅ Already up to date"
          fi
